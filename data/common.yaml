---
classes:
  - role::agent

# The layout of the OpenVox infrastructure.  The `basic_aio` Bolt plan writes
# the real values into the global Hiera layer on the compile masters; these
# defaults describe the all-in-one demo.
basic_aio::primary: puppet.vagrant
basic_aio::server: puppet.vagrant
basic_aio::compilers:
  - puppet.vagrant
basic_aio::ca_servers:
  - puppet.vagrant
basic_aio::db_servers:
  - puppet.vagrant
# Demo only.  `basic_aio` writes the password it was given into the global
# Hiera layer.
basic_aio::db_password: puppetdb
# Whether the bootstrap set up package repositories (false on airgapped hosts
# that get packages from a Satellite or other mirror).
basic_aio::manage_repos: true
# Where PostgreSQL comes from (pgdg or os) and its major version.
basic_aio::postgres_source: pgdg
basic_aio::postgres_version: '17'

lookup_options:
  profile::db::database_password:
    convert_to: Sensitive

profile::topology::primary: "%{lookup('basic_aio::primary')}"
profile::topology::server: "%{lookup('basic_aio::server')}"
profile::topology::compilers: "%{alias('basic_aio::compilers')}"
profile::topology::ca_servers: "%{alias('basic_aio::ca_servers')}"
profile::topology::db_servers: "%{alias('basic_aio::db_servers')}"
profile::db::database_password: "%{lookup('basic_aio::db_password')}"
profile::db::manage_package_repo: "%{alias('basic_aio::manage_repos')}"
profile::db::postgres_source: "%{lookup('basic_aio::postgres_source')}"
profile::db::postgres_version: "%{lookup('basic_aio::postgres_version')}"

mcollective::site_policies:
  - action: "allow"
    callers: "choria=vagrant.mcollective"
    actions: "*"
    facts: "*"
    classes: "*"

# `choria enroll` requests its certificate from the active CA.
mcollective::client_config:
  plugin.choria.puppetca_host: "%{lookup('basic_aio::ca_servers.0')}"

r10k::remote: "%{facts.role__server__r10k_remote}"

profile::ca::autosign:
  - "*.%{facts.networking.domain}"
  - vagrant.mcollective

choria::manage_package_repo: true
# Choria before 0.30.3 looks up `ssldir` with `puppet apply --configprint`,
# which OpenVox 9 removed.  Setting it explicitly skips that lookup.
choria::server_config:
  plugin.choria.ssldir: /etc/puppetlabs/puppet/ssl
choria::broker::ssldir: /etc/puppetlabs/puppet/ssl
choria::broker::network_broker: true
