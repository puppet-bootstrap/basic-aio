---
name: 'PR tests'

'on':
  - pull_request

jobs:
  vagrant-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: false
      - run: ruby -wc Vagrantfile

  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - bootstrap
          - profile
          - role
        openvox:
          - label: 'OpenVox 8'
            openvox_version: '~> 8'
            ruby_version: '3.2'
          - label: 'OpenVox 9'
            openvox_version: '~> 9'
            ruby_version: '4.0'
    env:
      OPENVOX_GEM_VERSION: ${{matrix.openvox.openvox_version}}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.openvox.ruby_version}}
          bundler-cache: true
          working-directory: site/${{matrix.module}}
      - run: bundle exec rake validate lint check rubocop
        working-directory: site/${{matrix.module}}

  parallel_spec:
    needs:
      - syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - bootstrap
          - profile
          - role
        openvox:
          - label: 'OpenVox 8'
            openvox_version: '~> 8'
            ruby_version: '3.2'
          - label: 'OpenVox 9'
            openvox_version: '~> 9'
            ruby_version: '4.0'
    env:
      OPENVOX_GEM_VERSION: ${{matrix.openvox.openvox_version}}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.openvox.ruby_version}}
          bundler-cache: true
          working-directory: site/${{matrix.module}}
      - run: bundle exec rake parallel_spec
        working-directory: site/${{matrix.module}}

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pip install 'yamllint>=1,<2'
      - name: Run yamllint
        run: yamllint .

  plans:
    # Pinned because the openvox-release package is specific to the Ubuntu release.
    runs-on: ubuntu-24.04
    env:
      BOLT_DISABLE_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v7
      # Bolt project plans aren't in a module, so lint them with the
      # bootstrap module's puppet-lint setup.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: site/bootstrap
      - name: Lint Bolt project plans
        run: bundle exec puppet-lint --fail-on-warnings ../../Boltdir/plans
        working-directory: site/bootstrap
      - name: Install OpenBolt
        # OpenBolt is not yet in the openvox9 collection.
        run: |
          wget -q https://apt.voxpupuli.org/openvox8-release-ubuntu24.04.deb
          sudo dpkg -i openvox8-release-ubuntu24.04.deb
          sudo apt-get update -q
          sudo apt-get install -y openbolt
      - name: Install Bolt modules
        run: bolt module install
        working-directory: Boltdir
      - name: Parse plans
        working-directory: Boltdir
        run: |
          project=$(sed -n 's/^name: *//p' bolt-project.yaml)
          rc=0
          for file in $(find ../site/*/plans plans -name '*.pp' 2>/dev/null | sort); do
            case "$file" in
              ../site/*)
                src=${file#../}
                path=${file#../site/}; module=${path%%/*}; rel=${path#*/plans/} ;;
              *)
                src=Boltdir/$file
                module=$project; rel=${file#plans/} ;;
            esac
            rel=${rel%.pp}
            name=$module
            [ "$rel" = init ] || name="${module}::${rel//\//::}"
            echo "::group::${name} (${src})"
            bolt plan show "$name" || { echo "::error file=${src}::Failed to parse plan ${name}"; rc=1; }
            echo '::endgroup::'
          done
          exit $rc
